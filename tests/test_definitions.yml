# Nama: Titanio Yudista
# NIM: 24120500031
# D4 individu — T2 POS UMKM, slice k8 (1 Januari–31 Desember 2025).
# Setiap SQL mengembalikan satu bilangan: jumlah grain yang melanggar.
# expected mencatat hasil seed; severity menentukan exit code gate.
tests:
  - name: paid_transaction_without_items
    topic: t2
    slice: k8
    dimension: completeness
    severity: blocking
    scope: source
    expected: fail
    perkiraan_baris: 152
    justifikasi: Transaksi PAID tanpa item membuat keputusan penjualan per produk dan kategori salah, jadi pemuatan diblokir.
    sql: >-
      SELECT count(*)
      FROM (SELECT transaction_id FROM raw_transactions
            WHERE upper(trim(status)) = 'PAID' GROUP BY transaction_id) t
      WHERE NOT EXISTS (SELECT 1 FROM raw_transaction_items i
                        WHERE i.transaction_id = t.transaction_id)

  - name: duplicate_transaction_id
    topic: t2
    slice: k8
    dimension: uniqueness
    severity: blocking
    scope: source
    expected: fail
    perkiraan_baris: 219
    justifikasi: ID transaksi kembar mengaburkan satu transaksi dan dapat menggandakan omzet, jadi pemuatan diblokir.
    sql: >-
      SELECT count(*) FROM (SELECT transaction_id FROM raw_transactions
      GROUP BY transaction_id HAVING count(*) > 1) duplicates

  - name: nonrefund_item_with_nonpositive_qty
    topic: t2
    slice: k8
    dimension: validity
    severity: blocking
    scope: source
    expected: fail
    perkiraan_baris: 616
    justifikasi: Qty tidak positif di luar refund mengubah unit dan omzet secara salah, jadi pemuatan diblokir.
    sql: >-
      SELECT count(*) FROM raw_transaction_items i
      WHERE try_cast(i.qty AS INTEGER) IS NULL
         OR (try_cast(i.qty AS INTEGER) <= 0 AND NOT EXISTS
             (SELECT 1 FROM raw_transactions t
              WHERE t.transaction_id = i.transaction_id
              GROUP BY t.transaction_id
              HAVING bool_and(coalesce(upper(trim(t.status)) = 'REFUND', false))))

  - name: paid_status_casing_inconsistent
    topic: t2
    slice: k8
    dimension: consistency
    severity: warning
    scope: source
    expected: fail
    perkiraan_baris: 480
    justifikasi: Kapitalisasi paid dan Paid dapat dinormalkan tanpa kehilangan transaksi; beri peringatan agar agregasi memakai status baku.
    sql: >-
      SELECT count(*) FROM raw_transactions
      WHERE upper(trim(status)) = 'PAID' AND status <> 'PAID'

  # Freshness historis; asumsi laporan tutup 2025-12-31 membutuhkan data hari itu.
  # Tanggal transaksi tercatat dipakai sebagai proksi, bukan timestamp ingest.
  - name: outlet_data_stale_at_report_cutoff
    topic: t2
    slice: k8
    dimension: timeliness
    severity: blocking
    scope: source
    expected: pass
    perkiraan_baris: 0
    justifikasi: Data outlet yang belum mencapai tanggal tutup laporan dapat membuat perbandingan omzet tahunan salah, jadi pemuatan diblokir.
    sql: >-
      WITH expected_outlets(outlet_id) AS
        (VALUES ('OUT-A'), ('OUT-B'), ('OUT-C')),
      latest AS
        (SELECT outlet_id,
                max(try_cast(substr(tanggal_waktu, 1, 10) AS DATE)) AS latest_date
         FROM raw_transactions
         WHERE try_cast(substr(tanggal_waktu, 1, 10) AS DATE)
               BETWEEN DATE '2025-01-01' AND DATE '2025-12-31'
         GROUP BY outlet_id)
      SELECT count(*) FROM expected_outlets e
      LEFT JOIN latest l USING (outlet_id)
      WHERE l.latest_date IS NULL OR l.latest_date < DATE '2025-12-31'

  - name: paid_total_disagrees_with_valid_items
    topic: t2
    slice: k8
    dimension: accuracy
    severity: blocking
    scope: source
    expected: fail
    perkiraan_baris: 9299
    justifikasi: Total PAID yang berbeda dari jumlah item membuat angka omzet salah, jadi pemuatan diblokir.
    sql: >-
      WITH unique_paid AS
        (SELECT transaction_id, max(try_cast(total_bayar AS BIGINT)) AS total_bayar
         FROM raw_transactions GROUP BY transaction_id
         HAVING count(*) = 1 AND upper(max(trim(status))) = 'PAID'),
      item_totals AS
        (SELECT transaction_id,
                sum(try_cast(qty AS BIGINT) * try_cast(harga_satuan AS BIGINT)
                    - try_cast(diskon AS BIGINT)) AS expected_total,
                count(*) AS item_rows,
                count(DISTINCT item_id) AS distinct_items,
                min(try_cast(qty AS BIGINT)) AS min_qty
         FROM raw_transaction_items GROUP BY transaction_id)
      SELECT count(*) FROM unique_paid h JOIN item_totals i USING (transaction_id)
      WHERE i.item_rows = i.distinct_items AND i.min_qty > 0
        AND h.total_bayar <> i.expected_total
